            <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark border-bottom border-body" data-bs-theme="dark"">

                    <a class="navbar-brand" href="#">Navbar</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"

                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                            <li class="nav-item">

                        <form class="d-flex" >
                            <nav class="container py-3">

    <!-- Linha 2: Menu Principal e Ações (Login/Logout) -->
    <div class="row align-items-center">
        <!-- Menu Principal -->
        <div class="col-md-9">
        </div>

        <!-- Botões de Ação (Login, Logout, Cadastro) -->
        <div class="col-md-3 d-flex justify-content-md-end align-items-center gap-2 mt-2 mt-md-0">
            <!-- Botão Login -->
            <a class="btn btn-outline-success btn-sm" href="#" target="_blank">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Login
            </a>

            <!-- Botão Logout -->
            <a class="btn btn-outline-primary btn-sm" href="#" target="_blank">
                <i class="fa-solid fa-right-from-bracket me-1"></i> Logout

            <!-- Ícone de Cadastro (exemplo de link/botão extra) -->

</nav>


                        </form>
                    </div>
                </div>
            </nav>
            <!-- Fim Navbar -->
          </nav>

        </header>

        <!-- Main da pagina -->
        <main class="adicionar_borda">
            <!-- Formulário de Cadastro -->
            <form action="cadastro/" method="get" target="_blank">

                <!-- Nome Completo -->
                <div class="m-3">
                    <label class="form-label" for="nome">Nome Completo:</label>
                    <input class="form-control" type="text" id="nome" name="nome" required
                        placeholder="Seu nome completo" title="Informe o seu nome completo (campo obrigatório)">
                </div>


                <div class="m-3">
                    <!-- E-mail de login -->
                    <label class="form-label" for="email">E-mail:</label>
                    <input class="form-control" type="email" id="email" name="email" required
                        placeholder="exemplo@email.com">
                </div>

                <div class="row m-2">
                    <!-- Senha -->
                    <div class="col-6">
                        <label class="form-label" for=senha">Senha:</label>
                        <input class="form-control" type="password" id="senha" name="senha" required minlength="6"
                            placeholder="Informe uma senha">
                    </div>
                    <!-- Confirmar Senha -->
                    <div class="col-6">
                        <label class="form-label" for="confirm_senha">Confirmar:</label>
                        <input class="form-control" type="password" id="confirm_senha" name="senha" required
                            minlength="6" placeholder="Confirme a senha informanda enteriormente">
                    </div>
                </div>
                <!-- Data de Nascimento -->
                <div class="row m-2">
                    <div class="col-md-6">
                        <label class="form-label" for="date">Data de Nascimento</label>
                        <input class="form-control" type="date" id="birth_date" name="birth_date">
                    </div>
                    <!-- Selecionar Sexo -->
                    <div class="col-md-6">
                        <label class="form-label" for="sexo">Sexo</label>
                        <input class="form-control" type="text" id="sexolist" name="listadesexo"
                            placeholder="Insira o seu Sexo:">
                    </div>
                </div>

                <!-- CPF -->
                <div class="m-3">
                    <label class="form-label" for="cpf">CPF:</label>
                    <input class="form-control" type="text" id="cpf" name="cpf" placeholder="000.000.000-00"
                        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: 000.000.000-00" required>
                </div>

                <!-- Campo Telefone (Validação com Regex) -->
                <div class="m-3">
                    <label class="form-label" for="telefone">Telefone*:</label>
                    <input class="form-control" type="tel" id="telefone" name="telefone" required
                        placeholder="(XX) XXXXX-XXXX" pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                        title="Formato: (XX) XXXXX-XXXX">
                </div>

                <!-- CEP -->

                <!-- Logradouro -->

                <!-- Complemento -->

                <!-- Bairro -->

                <!-- Cidade -->

                <!-- Estado -->

                <!-- Botões -->
                <div class="m-3 row">
                    <div class="col-6">
                        <button type="submit" class="form-control btn btn-outline-primary">
                            Enviar
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="reset" class="form-control btn btn-outline-warning">
                            Limpar
                        </button>
                    </div>
                </div>

            </form>
            <!-- Final do Form -->
        </main>

        <!--

                        <i class="bi bi-github"></i>
                    </a>
                </div>
